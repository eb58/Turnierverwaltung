<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>Turnierverwaltung</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f766e'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='white'%3E%E2%86%94%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand">
        <img class="logo" src="reinickendorf-wappen.svg" alt="Bezirkssymbol Reinickendorf">
        <div>
          <h1>Turnierverwaltung</h1>
          <p>Tischtennis-Doppelturniere</p>
        </div>
      </div>
      <div class="toolbar">
        <label for="turnierAuswahl">Turnier</label>
        <select id="turnierAuswahl" aria-label="Turnier auswählen"></select>
        <button id="neuLaden" class="secondary" type="button">Neu laden</button>
        <button id="beamerAnsicht" class="secondary management-only" type="button">Beameransicht</button>
        <button id="drucken" class="secondary management-only" type="button">Drucken</button>
        <button id="exportieren" class="secondary management-only" type="button">Exportieren</button>
        <button id="importieren" class="secondary management-only" type="button">Importieren</button>
        <input id="importDatei" type="file" accept="application/json,.json" hidden>
      </div>
    </header>

    <div id="meldung" class="meldung" role="alert" hidden></div>

    <details id="anlegenPanel" class="panel management-only" open>
      <summary>Neues Turnier anlegen</summary>
      <form id="turnierForm" class="turnier-form">
        <label>Turniername
          <input name="titel" required maxlength="100" placeholder="z. B. Herbstturnier">
        </label>
        <label>Modus
          <select name="modus">
            <option value="jeder-gegen-jeden">Jeder gegen jeden</option>
            <option value="ko">K.-o.-System</option>
          </select>
        </label>
        <div class="wide">
          <p class="hint">Je Doppelpaar die Namen der beiden Spieler eingeben. Möglich sind 5 bis 32 Doppelpaare.</p>
          <div id="paare" class="paare"></div>
          <div class="toolbar actions">
            <button id="paarHinzufuegen" class="secondary" type="button">Paar hinzufügen</button>
            <button id="paarEntfernen" class="secondary" type="button">Letztes Paar entfernen</button>
          </div>
        </div>
        <div class="wide toolbar">
          <span id="anzahl" aria-live="polite"></span>
          <button id="fantasiePaar" class="secondary" type="button">Fantasiepaar einfügen</button>
          <button type="submit">Turnier anlegen</button>
        </div>
      </form>
    </details>

    <section id="details" class="panel" aria-label="Spielplan und Ergebnisse"></section>
  </main>

  <dialog id="appDialog" aria-labelledby="dialogTitel">
    <form id="dialogForm">
      <h2 id="dialogTitel"></h2>
      <p id="dialogText"></p>
      <label id="dialogEingabeWrap" hidden>
        <span>Turniername</span>
        <input id="dialogEingabe" maxlength="100">
      </label>
      <div class="dialog-aktionen">
        <button id="dialogAbbrechen" class="secondary" type="button">Abbrechen</button>
        <button id="dialogBestaetigen" type="submit">Bestätigen</button>
      </div>
    </form>
  </dialog>

  <dialog id="paareDialog" class="breiter-dialog" aria-labelledby="paareDialogTitel">
    <form id="paareDialogForm">
      <h2 id="paareDialogTitel">Spielernamen ändern</h2>
      <p>Der Spielplan und bereits gespeicherte Ergebnisse bleiben erhalten.</p>
      <div id="paareBearbeiten" class="paare-bearbeiten"></div>
      <div class="dialog-aktionen">
        <button id="paareAbbrechen" class="secondary" type="button">Abbrechen</button>
        <button type="submit">Änderungen speichern</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js?v=15"></script>
</body>
</html>
